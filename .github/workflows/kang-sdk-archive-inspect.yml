name: KANG Shared SDK Archive Inspect
on:
  push:
    branches: [main]
    paths: [".github/workflows/kang-sdk-archive-inspect.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Drive shared SDK archives
        env:
          FLUTTERFRAMEWORK_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-5ed4-8209-be8c-fdcfe5dc2713/raw?se=2026-10-05T03%3A03%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=fa9847de-4309-5838-8866-c7801afadd55&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T22%3A38%3A43Z&ske=2026-10-05T22%3A38%3A43Z&sks=b&skv=2026-02-06&sig=tF2QCpUjKRFyaZgR7DlL42YuCNW9izdtF0L6jI1pO0M%3D'
