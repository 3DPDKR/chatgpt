name: Flutter 3.47.2 Tools Pub Cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/flutter-tools-cache.yml"

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: false

      - name: Populate portable Flutter tools Pub cache
        shell: bash
        run: |
          set -euxo pipefail
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"
          export PUB_CACHE="$GITHUB_WORKSPACE/portable-pub-cache"
          mkdir -p "$PUB_CACHE"
          "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" --version
          "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" pub --suppress-analytics --directory "$FLUTTER_ROOT/packages/flutter_tools" get --example
          test -f "$FLUTTER_ROOT/packages/flutter_tools/.dart_tool/package_config.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['PUB_CACHE']).resolve()
          cfg_path = pathlib.Path(os.environ['FLUTTER_ROOT']) / 'packages/flutter_tools/.dart_tool/package_config.json'
          cfg = json.loads(cfg_path.read_text())
          packages = cfg['packages']
          missing = []
          for item in packages:
              uri = item.get('rootUri', '')
              if uri.startswith('file://'):
                  p = pathlib.Path(uri[7:])
                  if not p.exists():
                      missing.append((item['name'], str(p)))
          print(f"package_config packages={len(packages)} missing_absolute_targets={len(missing)}")
          if missing:
              print('\n'.join(f"{n}: {p}" for n,p in missing[:20]))
              raise SystemExit(1)
          cache_packages = list((root / 'hosted').rglob('pubspec.yaml')) if (root / 'hosted').exists() else []
          print(f"portable cache package pubspec files={len(cache_packages)}")
          PY
        env:
          FLUTTER_ROOT: /tmp/placeholder

      - name: Normalize and package cache
        shell: bash
        run: |
          set -euxo pipefail
          export PUB_CACHE="$GITHUB_WORKSPACE/portable-pub-cache"
          rm -rf "$PUB_CACHE/log" "$PUB_CACHE/_temp" || true
          mkdir -p artifacts
          tar --sort=name --mtime='UTC 2026-09-04' --owner=0 --group=0 --numeric-owner -cJf artifacts/FLUTTER_3.47.2_TOOLS_PUB_CACHE_LINUX_v1.0.tar.xz -C "$GITHUB_WORKSPACE" portable-pub-cache
          sha256sum artifacts/FLUTTER_3.47.2_TOOLS_PUB_CACHE_LINUX_v1.0.tar.xz | tee artifacts/FLUTTER_3.47.2_TOOLS_PUB_CACHE_LINUX_v1.0.tar.xz.sha256
          stat -c '%s bytes' artifacts/FLUTTER_3.47.2_TOOLS_PUB_CACHE_LINUX_v1.0.tar.xz
          {
            echo '# Flutter 3.47.2 Tools Pub Cache'
            echo
            echo '- Purpose: make the restored Flutter tools runnable without downloading packages at first use.'
            echo '- Generated from Flutter 3.47.2 stable with the bundled Dart SDK.'
            echo '- Command: dart pub --directory packages/flutter_tools get --example'
            echo '- Install location: <flutter-root>/.pub-cache'
            echo '- Set: PUB_CACHE=<flutter-root>/.pub-cache'
            echo
            echo 'Copyright Daehyun Kang'
            echo
            echo 'AI를 활용하여 제작되었습니다.'
          } > artifacts/FLUTTER_3.47.2_TOOLS_PUB_CACHE_README.md

      - name: Upload portable cache
        uses: actions/upload-artifact@v4
        with:
          name: FLUTTER_3.47.2_TOOLS_PUB_CACHE_LINUX_v1.0
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
