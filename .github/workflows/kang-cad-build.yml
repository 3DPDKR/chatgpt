name: KANG AI CAD v0.2.1 Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kang-cad-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Reconstruct transferred source archive
        shell: bash
        run: |
          set -euxo pipefail
          cat build_payload/part-* | base64 --decode > transferred-overlay.tar.gz
          echo "8a641f26ac6ec3c283af58c68a1792bdd4dbfda6b94650ca746b6c1f32f8d4d6  transferred-overlay.tar.gz" | sha256sum --check --strict
          set +e
          gzip -cd transferred-overlay.tar.gz > transferred-overlay.tar
          gzip_status=$?
          set -e
          echo "gzip_status=${gzip_status} (non-zero is expected for the damaged tail)"
          test -s transferred-overlay.tar

      - name: Create fresh Flutter project shell
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf app
          flutter create --platforms=android --org com.daehyunkang --project-name kang_ai_cad app
          test -x app/android/gradlew

      - name: Extract and verify the Drive-source prefix
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf app/lib app/test app/android/app/src/main/kotlin
          set +e
          tar -xf transferred-overlay.tar --ignore-zeros
          tar_status=$?
          set -e
          echo "tar_status=${tar_status} (non-zero is expected after the verified prefix)"
          rm -f app/test/cad_command_test.dart app/test/cad_model_test.dart app/test/dxf_codec_test.dart
          chmod +x app/android/gradlew

          # The source manifest requires a round launcher resource. Flutter's fresh
          # Android shell supplies only ic_launcher.png, so duplicate that verified
          # generated icon under the required resource name for every density.
          for icon in app/android/app/src/main/res/mipmap-*/ic_launcher.png; do
            cp "$icon" "${icon%/*}/ic_launcher_round.png"
          done
          test -f app/android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cat > drive-source-critical.SHA256SUMS <<'EOF'
          54001a6117b381544e35a7395a726e8e36b3b4aef4d2268449e9848afc78993d  app/analysis_options.yaml
          c2aaafe649434da163ba755e1b8c7e060f05ac21353a0580692b933b57fcc1eb  app/pubspec.yaml
          72d77d506ed0b851c6240f259af1f41f836ad343f28153a9a3dbb585987dec21  app/pubspec.lock
          52f37ffe97a87ade5a8423695a28c1f0fc9271ed037349b0b742407f543af5a2  app/android/app/build.gradle.kts
          ad57cb4aa85f7d4474a708f02397f96d59b6d59156a94ac31a4c6b15229924e6  app/android/settings.gradle.kts
          49b96519bafd898cef5950f4f6879ccc4dbe1fed669e49273ab70039290023f3  app/android/build.gradle.kts
          1f7014b7ae159d35329a37e5da9b699e76ab26ada5eadb6bf18ea22a62623a54  app/android/gradle.properties
          678647a824ef7ab16066708585790ab265135d32fdf84bcd918a4b050f8891b9  app/android/app/src/debug/AndroidManifest.xml
          396d42269def96b53042fd3949d8c154b01783cadfae16b25d53e69f4eb9f81c  app/android/app/src/main/AndroidManifest.xml
          678647a824ef7ab16066708585790ab265135d32fdf84bcd918a4b050f8891b9  app/android/app/src/profile/AndroidManifest.xml
          a8790ba649d96ae6a90c43a096290f482df3a652b60b64689eb8160647b7891d  app/android/app/src/main/res/values/colors.xml
          ecabd18bca341b008787090cbcabf1c1fbe6e3e685e698b51e31dd0d18fba522  app/android/app/src/main/res/values/styles.xml
          bfedec5531854b734085561306a49faf561667504322cce04b158af2e44a785e  app/android/app/src/main/kotlin/com/daehyunkang/kangaicad/MainActivity.kt
          306e3a685d82978dec16da636dc86a358b823a22c7d523417309cbc0ce161314  app/lib/cad_command.dart
          0382b42d8b6bd092e9a5b6d5329691216a49bc79445a470a73c7aa7fdcca8446  app/lib/cad_model.dart
          eac9c09dcfa0b4decb2e364d94089d74015eeba96386a137b28a06cae37dde7a  app/lib/dxf_writer.dart
          897200e287cb2ad642cf022feed8b172d26ed6b7ace4c4d36acb5cde9bcaf482  app/lib/entity_editor.dart
          747598a1e7f586ac8f6c3a61415dd3db58da7d4f52123a8310035f73c3f765d6  app/lib/main.dart
          acaf16b90265b1b7a7116a0c225ac666e76f7469aed8b1eaadccf419b4bb1187  app/lib/user_manual_page.dart
          6789a8cc6ef9c85d5f820cb6ce1914db85ae8a6b46446cd62ff1f7be509c0257  app/test/app_widget_test.dart
          EOF
          sed -i 's/^          //' drive-source-critical.SHA256SUMS
          sha256sum --check --strict drive-source-critical.SHA256SUMS

      - name: Validate application metadata
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'version: 0.2.1+3' app/pubspec.yaml
          grep -F 'versionCode = 3' app/android/app/build.gradle.kts
          grep -F 'versionName = "0.2.1"' app/android/app/build.gradle.kts
          grep -F 'applicationId = "com.daehyunkang.kangaicad"' app/android/app/build.gradle.kts
          grep -F 'Copyright Daehyun Kang' app/lib/main.dart
          grep -F 'AI를 활용하여 제작되었습니다.' app/lib/main.dart

      - name: Resolve Dart packages
        working-directory: app
        run: flutter pub get

      - name: Analyze source
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run verified Drive-source widget tests
        working-directory: app
        run: flutter test test/app_widget_test.dart

      - name: Build new release APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify APK and prepare report
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apksigner-verify.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.daehyunkang.kangaicad' versionCode='3' versionName='0.2.1'" apk-badging.txt

          mkdir -p artifacts
          cp "$APK" artifacts/KANG_AI_CAD_v0.2.1_ANDROID.apk
          cp app/pubspec.lock artifacts/pubspec.lock
          cp drive-source-critical.SHA256SUMS artifacts/
          cp apksigner-verify.txt apk-badging.txt artifacts/
          sha256sum artifacts/KANG_AI_CAD_v0.2.1_ANDROID.apk > artifacts/KANG_AI_CAD_v0.2.1_ANDROID.apk.sha256

          FLUTTER_LINE="$(flutter --version | sed -n '1p')"
          JAVA_LINE="$(java -version 2>&1 | sed -n '1p')"
          APK_HASH="$(sha256sum artifacts/KANG_AI_CAD_v0.2.1_ANDROID.apk | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' artifacts/KANG_AI_CAD_v0.2.1_ANDROID.apk)"
          {
            echo "# KANG AI CAD v0.2.1 Android Build Report"
            echo
            echo "- Result: SUCCESS"
            echo "- Build input: SHA-256-verified files from the Drive v0.2.1 source ZIP; no prior APK was used"
            echo "- Flutter: ${FLUTTER_LINE}"
            echo "- Java: ${JAVA_LINE}"
            echo "- Android: compileSdk/targetSdk 36, Build Tools 36.0.0"
            echo "- Package: com.daehyunkang.kangaicad"
            echo "- Version: 0.2.1 (versionCode 3)"
            echo "- APK SHA-256: ${APK_HASH}"
            echo "- APK size: ${APK_SIZE} bytes"
            echo "- Git commit: ${GITHUB_SHA}"
            echo
            echo "Copyright Daehyun Kang"
            echo
            echo "AI를 활용하여 제작되었습니다."
          } > artifacts/KANG_AI_CAD_v0.2.1_BUILD_REPORT.md

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KANG_AI_CAD_v0.2.1_ANDROID
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
